<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="840" height="310" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="34" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="0.02em">LinkRouter · Swift 6 Architecture &amp; URL Dispatch Flow</text>
  <text x="812" y="34" text-anchor="end" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, monospace">macOS 14+ · LSUIElement</text>
  <line x1="28" y1="48" x2="812" y2="48" stroke="#1e293b" stroke-width="1"/>

  <!-- Box 1: macOS LaunchServices -->
  <rect x="28" y="96" width="152" height="106" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="104" y="122" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="0.08em">MACOS SYSTEM</text>
  <text x="104" y="144" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">LaunchServices</text>
  <text x="104" y="166" text-anchor="middle" fill="#cbd5e1" font-size="11">http / https clicks</text>
  <text x="104" y="184" text-anchor="middle" fill="#64748b" font-size="10.5">Slack · Mail · Terminal</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="180" y1="149" x2="218" y2="149" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Box 2: LinkRouter AppKit/SwiftUI Shell -->
  <rect x="224" y="70" width="186" height="158" rx="10" fill="#172033" stroke="#3b82f6" stroke-width="1.4"/>
  <rect x="224" y="70" width="186" height="4" rx="2" fill="url(#accentBlue)"/>
  <text x="317" y="96" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="700" letter-spacing="0.08em">EXECUTABLE TARGET</text>
  <text x="317" y="116" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="700">LinkRouter (AppKit)</text>
  <text x="240" y="140" fill="#cbd5e1" font-size="11">• AppDelegate &amp; Menu Bar</text>
  <text x="240" y="159" fill="#cbd5e1" font-size="11">• SwiftUI Settings Window</text>
  <text x="240" y="178" fill="#cbd5e1" font-size="11">• Live JSON ConfigStore</text>
  <text x="240" y="197" fill="#cbd5e1" font-size="11">• Chromium Profile Reader</text>
  <text x="240" y="216" fill="#94a3b8" font-size="10.5" font-family="ui-monospace, monospace">~/.config/linkrouter/</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="410" y1="149" x2="448" y2="149" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Box 3: RouterCore Pure Swift -->
  <rect x="454" y="70" width="186" height="158" rx="10" fill="#172033" stroke="#10b981" stroke-width="1.4"/>
  <text x="547" y="96" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700" letter-spacing="0.08em">PURE SWIFT · SENDABLE</text>
  <text x="547" y="116" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="700">RouterCore</text>
  <text x="470" y="140" fill="#cbd5e1" font-size="11">1. Unwrap redirects</text>
  <text x="478" y="156" fill="#94a3b8" font-size="10">SafeLinks · Slack · Google</text>
  <text x="470" y="177" fill="#cbd5e1" font-size="11">2. Domain &amp; path match</text>
  <text x="478" y="193" fill="#94a3b8" font-size="10">Segment-safe · Subdomains</text>
  <text x="470" y="214" fill="#34d399" font-size="10.5">✓ Tested w/ Swift Testing</text>

  <!-- Split arrows 3 -> Targets -->
  <path d="M 640 128 C 664 128, 664 106, 686 106" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
  <path d="M 640 170 C 664 170, 664 192, 686 192" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowTeal)"/>

  <!-- Box 4a: Work Profile -->
  <rect x="692" y="72" width="120" height="68" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="752" y="95" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">RULE MATCH</text>
  <text x="752" y="113" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Chrome · Work</text>
  <text x="752" y="129" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="ui-monospace, monospace">--profile-directory</text>

  <!-- Box 4b: Personal Fallback -->
  <rect x="692" y="158" width="120" height="68" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="752" y="181" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700">FALLBACK</text>
  <text x="752" y="199" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Default Browser</text>
  <text x="752" y="215" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="ui-monospace, monospace">Profile: Default</text>

  <!-- Footer bar -->
  <rect x="28" y="248" width="784" height="38" rx="8" fill="#1e293b" opacity="0.65"/>
  <text x="44" y="271" fill="#94a3b8" font-size="11">Zero third-party dependencies · Swift 6 strict concurrency · Ad-hoc codesigned .app via ./build.sh · Verified on GitHub Actions macOS CI</text>
</svg>
